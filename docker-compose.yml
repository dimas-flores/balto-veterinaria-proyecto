name: ${COMPOSE_PROJECT_NAME:-balto}

x-drupal-environment: &drupal-environment
  DB_HOST: mariadb
  DB_PORT: '3306'
  DB_NAME: ${DB_NAME:-balto}
  DB_USER: ${DB_USER:-balto}
  DB_PASSWORD: ${DB_PASSWORD:?Genera .env con python3 scripts/init-env.py}
  DRUPAL_HASH_SALT: ${DRUPAL_HASH_SALT:?Falta DRUPAL_HASH_SALT}
  DRUPAL_BASE_URL: ${DRUPAL_BASE_URL:-http://localhost:8080}
  DRUPAL_TRUSTED_HOSTS: ${DRUPAL_TRUSTED_HOSTS:-localhost,127.0.0.1,drupal}
  VET_API_KEY: ${VET_API_KEY:?Falta VET_API_KEY}
  CHAT_WEBHOOK_URL: ${CHAT_WEBHOOK_URL:-http://localhost:5678/webhook/chat}
  CHAT_ALLOWED_ORIGIN: ${CHAT_ALLOWED_ORIGIN:-http://localhost:8080}
  BALTO_MERCADO_PAGO_TEST_BUYER_ID: ${BALTO_MERCADO_PAGO_TEST_BUYER_ID:-}
  BALTO_MERCADO_PAGO_TEST_TOKEN: ${BALTO_MERCADO_PAGO_TEST_TOKEN:-}
  BALTO_CULQI_PUBLIC_KEY: ${BALTO_CULQI_PUBLIC_KEY:-}
  BALTO_CULQI_SECRET_KEY: ${BALTO_CULQI_SECRET_KEY:-}
  BALTO_CULQI_ALLOW_LIVE: ${BALTO_CULQI_ALLOW_LIVE:-false}
  BALTO_BREVO_API_KEY: ${BALTO_BREVO_API_KEY:-}
  BALTO_BREVO_SENDER_EMAIL: ${BALTO_BREVO_SENDER_EMAIL:-}
  BALTO_N8N_SECRET: ${BALTO_N8N_SECRET:-}
  BALTO_N8N_ORDER_URL: ${BALTO_N8N_ORDER_URL:-http://n8n:5678/webhook/balto-pedido}
  TZ: ${TZ:-America/Lima}

services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-balto}
      MARIADB_USER: ${DB_USER:-balto}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Falta DB_ROOT_PASSWORD}
      TZ: ${TZ:-America/Lima}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks: [backend]
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging: &logging
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # Instalador de una ejecución: Apache arranca solo si termina correctamente.
  drupal-init:
    image: balto-drupal:local
    build:
      context: .
      dockerfile: drupal/Dockerfile
    restart: 'no'
    entrypoint: ['/bin/bash', '/opt/balto/scripts/install.sh']
    environment:
      <<: *drupal-environment
      DRUPAL_ADMIN_USER: ${DRUPAL_ADMIN_USER:-admin_balto}
      DRUPAL_ADMIN_PASSWORD: ${DRUPAL_ADMIN_PASSWORD:?Falta DRUPAL_ADMIN_PASSWORD}
      DRUPAL_ADMIN_EMAIL: ${DRUPAL_ADMIN_EMAIL:-admin@example.invalid}
      DRUPAL_STORE_MANAGER_USER: ${DRUPAL_STORE_MANAGER_USER:-tienda_balto}
      DRUPAL_STORE_MANAGER_PASSWORD: ${DRUPAL_STORE_MANAGER_PASSWORD:?Ejecuta python3 scripts/init-env.py}
      DRUPAL_CLIENT_USER: ${DRUPAL_CLIENT_USER:-cliente_balto}
      DRUPAL_CLIENT_PASSWORD: ${DRUPAL_CLIENT_PASSWORD:?Ejecuta python3 scripts/init-env.py}
    volumes:
      - drupal_files:/opt/drupal/web/sites/default/files
    networks: [backend]
    depends_on:
      mariadb:
        condition: service_healthy
    logging: *logging

  drupal:
    image: balto-drupal:local
    build:
      context: .
      dockerfile: drupal/Dockerfile
    restart: unless-stopped
    environment: *drupal-environment
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${DRUPAL_PORT:-8080}:80'
    volumes:
      - drupal_files:/opt/drupal/web/sites/default/files
    networks: [backend]
    depends_on:
      mariadb:
        condition: service_healthy
      drupal-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'php', '-r', 'exit(@file_get_contents("http://localhost/user/login") === false ? 1 : 0);']
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s
    logging: *logging

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.47.4
    entrypoint: ['/bin/sh', '/opt/balto/n8n-start.sh']
    restart: unless-stopped
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${N8N_PORT:-5678}:5678'
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: '5678'
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://localhost:5678}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      N8N_WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Falta N8N_ENCRYPTION_KEY}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      GEMINI_ENABLED: ${GEMINI_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      N8N_DEFAULT_LOCALE: es
      GENERIC_TIMEZONE: ${TZ:-America/Lima}
      TZ: ${TZ:-America/Lima}
      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_MAX_AGE: '168'
      DRUPAL_BASE_URL: ${DRUPAL_BASE_URL:-http://localhost:8080}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'true'
      BALTO_N8N_SECRET: ${BALTO_N8N_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      STOCK_ALERT_THRESHOLD: ${STOCK_ALERT_THRESHOLD:-5}
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      DRUPAL_INTERNAL_URL: http://drupal
      VET_API_KEY: ${VET_API_KEY:?Falta VET_API_KEY}
      CHAT_ALLOWED_ORIGIN: ${CHAT_ALLOWED_ORIGIN:-http://localhost:8080}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
      - ./scripts/n8n-start.sh:/opt/balto/n8n-start.sh:ro
      - ./scripts/n8n-prepare.cjs:/opt/balto/n8n-prepare.cjs:ro
    networks: [backend]
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://127.0.0.1:5678/healthz").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    logging: *logging

volumes:
  mariadb_data:
  drupal_files:
  n8n_data:

networks:
  # Red bridge privada entre servicios; con salida para Composer y servicios futuros.
  # MariaDB no publica ningún puerto al equipo ni a internet.
  backend:
    driver: bridge
