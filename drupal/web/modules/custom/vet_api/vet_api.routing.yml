vet_api.home:
  path: '/inicio'
  defaults:
    _controller: '\Drupal\vet_api\Controller\HomeController::home'
    _title: 'Medicina para tu mascota'
  requirements:
    _permission: 'access content'

vet_api.business_settings:
  path: '/admin/config/balto/negocio'
  defaults:
    _form: '\Drupal\vet_api\Form\BusinessSettingsForm'
    _title: 'Datos y horarios de BALTO'
  requirements:
    _permission: 'administer balto business'

vet_api.catalog:
  path: '/tienda'
  defaults:
    _controller: '\Drupal\vet_api\Controller\CatalogController::catalog'
    _title: 'Tienda BALTO'
  requirements:
    _permission: 'access content'

vet_api.api_products:
  path: '/api/vet/products'
  defaults:
    _controller: '\Drupal\vet_api\Controller\ApiController::products'
  requirements:
    _access: 'TRUE'
  methods: [GET]
  options:
    no_cache: TRUE

vet_api.api_product:
  path: '/api/vet/products/{sku}'
  defaults:
    _controller: '\Drupal\vet_api\Controller\ApiController::product'
  requirements:
    _access: 'TRUE'
  methods: [GET]
  options:
    no_cache: TRUE

vet_api.api_categories:
  path: '/api/vet/categories'
  defaults:
    _controller: '\Drupal\vet_api\Controller\ApiController::categories'
  requirements:
    _access: 'TRUE'
  methods: [GET]
  options:
    no_cache: TRUE

vet_api.api_services:
  path: '/api/vet/services'
  defaults:
    _controller: '\Drupal\vet_api\Controller\ApiController::services'
  requirements:
    _access: 'TRUE'
  methods: [GET]
  options:
    no_cache: TRUE

vet_api.api_schedule:
  path: '/api/vet/schedule'
  defaults:
    _controller: '\Drupal\vet_api\Controller\ApiController::schedule'
  requirements:
    _access: 'TRUE'
  methods: [GET]
  options:
    no_cache: TRUE

vet_api.cart_summary:
  path: '/carrito/resumen'
  defaults:
    _controller: '\Drupal\vet_api\Controller\CartSummaryController::summary'
  requirements:
    _permission: 'access content'
  options:
    no_cache: TRUE

vet_api.privacy:
  path: '/privacidad'
  defaults:
    _controller: '\Drupal\vet_api\Controller\LegalController::privacy'
    _title: 'Privacidad'
  requirements:
    _permission: 'access content'

vet_api.purchase_terms:
  path: '/condiciones-de-compra'
  defaults:
    _controller: '\Drupal\vet_api\Controller\LegalController::purchaseTerms'
    _title: 'Condiciones de compra'
  requirements:
    _permission: 'access content'

vet_api.appointment_slots:
  path: '/citas/turnos'
  defaults:
    _controller: '\Drupal\vet_api\Controller\AppointmentController::slots'
  requirements:
    _access: 'TRUE'
  methods: [GET]

vet_api.appointment_reserve:
  path: '/citas/reservar'
  defaults:
    _controller: '\Drupal\vet_api\Controller\AppointmentController::reserve'
  requirements:
    _access: 'TRUE'
  methods: [POST]

vet_api.appointment_agenda:
  path: '/admin/commerce/agenda-balto'
  defaults:
    _controller: '\Drupal\vet_api\Controller\AppointmentController::agenda'
    _title: 'Agenda de BALTO'
  requirements:
    _permission: 'administer site configuration'
  options:
    _admin_route: TRUE
